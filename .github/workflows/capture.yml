#!/usr/bin/env python3
"""
Capture Grafana panels and insert them into a pre-made Excel template.
Slot is chosen by the GitHub Actions schedule (UTC) or workflow_dispatch input.
"""
import json
import os
import sys
from datetime import datetime
from pathlib import Path
from zoneinfo import ZoneInfo

from openpyxl import load_workbook
from openpyxl.drawing.image import Image as XLImage
from openpyxl.utils import get_column_letter
from playwright.sync_api import sync_playwright

TZ = ZoneInfo("Asia/Bangkok")

SLOT_BY_CRON = {
    "0 0 * * *":  "07:00",
    "0 1 * * *":  "08:00",
    "0 2 * * *":  "09:00",
    "0 5 * * *":  "12:00",
    "0 6 * * *":  "13:00",
    "0 12 * * *": "19:00",
    "0 13 * * *": "20:00",
}

ROOT = Path(__file__).resolve().parent
CFG = json.loads((ROOT / "config.json").read_text(encoding="utf-8"))
NOW = datetime.now(TZ)


def resolve_slot() -> str:
    slot = (os.getenv("SLOT") or "").strip()
    schedule = (os.getenv("SCHEDULE") or "").strip()
    if not slot:
        slot = SLOT_BY_CRON.get(schedule)

    if slot not in CFG["anchors"]:
        print(f"ERROR: unknown slot {slot!r}. "
              f"known={list(CFG['anchors'])} SLOT={os.getenv('SLOT')!r} "
              f"SCHEDULE={schedule!r}", file=sys.stderr)
        sys.exit(1)
    return slot


def anchor_of(img) -> str:
    a = img.anchor
    if isinstance(a, str):
        return a
    return f"{get_column_letter(a._from.col + 1)}{a._from.row + 1}"


def drop_old_image(ws, cell: str) -> None:
    """Remove any image already anchored at `cell` so re-runs don't duplicate."""
    for img in list(ws._images):
        if anchor_of(img) == cell:
            ws._images.remove(img)


def ensure_logged_in(page, metric: str) -> None:
    if "/login" in page.url.lower():
        raise RuntimeError(f"Grafana session expired while opening {metric}: {page.url}")


def main() -> None:
    slot = resolve_slot()
    date = NOW.strftime("%Y-%m-%d")

    reports_dir = ROOT / "reports"
    shots_dir = ROOT / "screenshots" / date / slot.replace(":", "")
    reports_dir.mkdir(parents=True, exist_ok=True)
    shots_dir.mkdir(parents=True, exist_ok=True)

    report_path = reports_dir / f"{date}.xlsx"
    template_path = ROOT / "template.xlsx"
    source = report_path if report_path.exists() else template_path
    if not source.exists():
        print(f"ERROR: Excel source not found: {source}", file=sys.stderr)
        sys.exit(1)

    state = ROOT / "storage_state.json"
    if not state.exists():
        print("ERROR: storage_state.json missing "
              "(restore from GRAFANA_STORAGE_STATE_B64)", file=sys.stderr)
        sys.exit(1)

    wb = load_workbook(source)

    sheet_name = CFG["sheet"]
    if sheet_name not in wb.sheetnames:
        print(f"ERROR: worksheet {sheet_name!r} not found. "
              f"available={wb.sheetnames}", file=sys.stderr)
        sys.exit(1)

    ws = wb[sheet_name]
    anchors = CFG["anchors"][slot]
    failures: list[str] = []

    with sync_playwright() as p:
        with p.chromium.launch(headless=True) as browser:
            ctx = browser.new_context(
                storage_state=str(state),
                viewport={"width": 1600, "height": 1000},
                locale="en-US",
                # จำเป็นชั่วคราว: cert ของ grafana.th2p ยังมี SAN ไม่ตรง (th1p)
                ignore_https_errors=True,
            )
            page = ctx.new_page()
            page.set_default_timeout(60_000)
            page.set_default_navigation_timeout(60_000)

            for metric, url in CFG["urls"].items():
                if metric not in anchors:
                    print(f"skip {metric} (no anchor for slot {slot})")
                    continue

                print(f"[{slot}] capturing {metric} ...")
                try:
                    page.goto(url, wait_until="domcontentloaded", timeout=60_000)
                    ensure_logged_in(page, metric)      # เช็คทันทีหลัง goto

                    page.wait_for_timeout(8_000)        # ให้ panel render เสร็จ

                    ensure_logged_in(page, metric)      # เผื่อ redirect หลังโหลด
                    png = shots_dir / f"{metric}.png"
                    page.screenshot(path=str(png), full_page=True)

                    cell = anchors[metric]
                    drop_old_image(ws, cell)
                    img = XLImage(str(png))
                    img.width, img.height = 520, 300
                    ws.add_image(img, cell)

                    print(f"[{slot}] OK: {metric} -> {png}")
                except Exception as exc:                # ไม่ให้ panel เดียวฆ่าทั้ง run
                    msg = f"{metric}: {type(exc).__name__}: {exc}"
                    print(f"ERROR: {msg}", file=sys.stderr)
                    failures.append(msg)

            ctx.close()

    if failures:
        print("\nCapture failed:", file=sys.stderr)
        for f in failures:
            print(f"- {f}", file=sys.stderr)
        # อย่า save/commit Excel ที่ได้ภาพไม่ครบ
        sys.exit(2)

    ws[CFG["date_cell"]] = NOW.strftime("%d %b %Y")
    wb.save(report_path)
    print(f"OK -> {report_path}")


if __name__ == "__main__":
    main()
